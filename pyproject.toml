[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse-reporting"
version = "0.1.0"
description = "Static, evidence-linked operational reporting for FactoryPulse."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "David"}]
dependencies = ["duckdb>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
factorypulse-report = "factorypulse_reporting.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
